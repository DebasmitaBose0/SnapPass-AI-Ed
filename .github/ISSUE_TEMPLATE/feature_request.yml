name: 💡 Feature Request (GSSoC 2026)
description: Propose a new feature or enhancement for SnapPass-AI
title: '[GSSoC_2026] Feature: '
labels: ['gssoc2026', 'enhancement']
body:
  - type: markdown
    attributes:
      value: Thank you for proposing a feature for SnapPass-AI!
  - type: textarea
    id: problem
    attributes:
      label: 🚀 Feature Problem Statement
      description: What problem does this feature solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 💡 Proposed Solution
      description: Describe your proposed implementation plan.
    validations:
      required: true
